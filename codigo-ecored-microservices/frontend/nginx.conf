server {
  # Nginx atiende HTTP dentro del contenedor.
  listen 80;
  server_name _;

  # Vite deja el resultado de compilación en este directorio.
  root /usr/share/nginx/html;
  index index.html;

  location = /runtime-config.js {
    # La configuración puede cambiar entre ejecuciones de la misma imagen.
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    # Si una ruta no es un archivo, entrega React para resolverla en el navegador.
    try_files $uri $uri/ /index.html;
  }
}
