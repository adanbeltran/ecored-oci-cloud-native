apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecored-companies
  namespace: ecored
  labels:
    app: ecored-companies
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ecored-companies
  template:
    metadata:
      labels:
        app: ecored-companies
    spec:
      imagePullSecrets:
        - name: ocir-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: companies
          image: __OCIR_PREFIX__/ecored-companies:__VERSION__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: companies-config
            - secretRef:
                name: companies-secrets
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: ecored-companies
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: ecored-companies
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: ecored-companies
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecored-companies
  namespace: ecored
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-internal: "true"
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "__PRIVATE_SUBNET_OCID__"
    oci.oraclecloud.com/security-rule-management-mode: "NSG"
    oci.oraclecloud.com/oci-backend-network-security-group: "__WORKLOADS_NSG_OCID__"
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - __PUBLIC_SUBNET_CIDR__
  selector:
    app: ecored-companies
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecored-companies-pdb
  namespace: ecored
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecored-companies
---
