apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecored-frontend
  namespace: ecored
  labels:
    app: ecored-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ecored-frontend
  template:
    metadata:
      labels:
        app: ecored-frontend
    spec:
      imagePullSecrets:
        - name: ocir-secret
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: __OCIR_PREFIX__/ecored-frontend:__VERSION__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
